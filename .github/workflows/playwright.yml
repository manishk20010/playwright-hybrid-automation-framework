name: Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      CI: true
      ENV: UAT
      URL: https://automationexercise.com

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check environment
        run: |
          echo "ENV=$ENV"
          echo "URL=$URL"
          echo "CI=$CI"

      - name: Run Playwright tests
        run: npx playwright test

      - name: Check Allure Results
        if: always()
        run: |
         echo "===== ALLURE RESULT FILES ====="
         find allure-results -type f -name "*-result.json" | sort
         echo "===== TOTAL ====="
         find allure-results -type f -name "*-result.json" | wc -l

         - name: Inspect Allure Test Results
          if: always()
          run: |
          echo "===== TEST NAMES / STATUS / HISTORY ====="

          for file in allure-results/*-result.json; do
          echo "----------------------------------------"
          echo "FILE: $file"
          jq -r '"name=\(.name) | status=\(.status) | historyId=\(.historyId) | fullName=\(.fullName)"' "$file"
          done


      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --output allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7


  deploy:
    if: always()
    needs: test

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy Allure Report
        id: deployment
        uses: actions/deploy-pages@v4